<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProjectFlow V4.0-B 参考图比对</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#061222;color:#c6d7e9;font:14px "Segoe UI","Microsoft YaHei",sans-serif}header{height:54px;display:flex;align-items:center;gap:24px}h1{font-size:18px;margin:0}p{margin:0;color:#7e9dbb;font-size:12px}.controls{display:flex;align-items:center;gap:12px;margin-left:auto}button{background:#17364e;color:#bce3f5;border:1px solid #325d7e;border-radius:5px;padding:6px 12px;cursor:pointer}.comparison{display:grid;grid-template-columns:1280px 1280px;gap:16px;width:2576px;position:relative}figure{margin:0}figcaption{height:27px;font-size:12px;color:#91b4d5}img{display:block;width:1280px;height:801px}.overlay{grid-template-columns:1280px;width:1280px}.overlay figure:nth-child(2){position:absolute;top:0;left:0;opacity:var(--opacity,.5)}.overlay figure:nth-child(2) figcaption{visibility:hidden}footer{padding:12px 0;color:#7d9fb9;font-size:12px}
</style></head>
<body><header><div><h1>ProjectFlow V4.0-B · 截图驱动复刻</h1><p>两张图均保留 1280 × 801 原始视口。水平滚动可查看完整图片。</p></div><div class="controls"><button id="toggle">切换为叠加比对</button><label>叠加透明度 <input id="opacity" type="range" min="0" max="100" value="50"></label></div></header><main class="comparison" id="comparison"><figure><figcaption>用户提供的视觉基准</figcaption><img src="reference.jpg" alt="参考图：三栏午夜蓝 ProjectFlow 工作区"></figure><figure><figcaption>已实现的当前状态页 · 明确标注示例内容</figcaption><img src="current-desktop.png" alt="本轮实现的当前状态页截图"></figure></main><footer>重点检查：栏宽、主卡片位置、背景层次、左下山脉与右下星球。界面为真实 HTML/CSS；示例进度和计划不会写入项目事实。</footer><script>
const comparison=document.getElementById('comparison');document.getElementById('toggle').addEventListener('click',event=>{const overlay=comparison.classList.toggle('overlay');event.target.textContent=overlay?'切换为并排比对':'切换为叠加比对'});document.getElementById('opacity').addEventListener('input',event=>comparison.style.setProperty('--opacity',event.target.value/100));
</script></body></html>
