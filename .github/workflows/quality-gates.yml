name: ProjectFlow V3.8.5 Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_model:
        description: "使用 Secrets 执行 GLM 与 DeepSeek V3.8.5 真实验收"
        required: false
        default: false
        type: boolean
      real_model_scope:
        description: "真实模型范围；affected 仅执行本次受影响门禁"
        required: false
        default: full
        type: choice
        options:
          - affected
          - full
      real_model_provider:
        description: "真实模型 Provider；默认同时验收，也可定向复验"
        required: false
        default: both
        type: choice
        options:
          - both
          - glm
          - deepseek

permissions:
  contents: read

jobs:
  backend-unit-and-h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 后端、H2 与项目历程冻结回归
        working-directory: backend
        run: mvn -B test
      - name: 确认项目历程冻结、Prompt 与 Dogfood 门禁已执行
        working-directory: backend
        shell: bash
        run: |
          test -f target/surefire-reports/TEST-com.projectflow.ProjectHistoryFrozenDatasetTest.xml
          test -f target/surefire-reports/TEST-com.projectflow.service.ProjectHistoryPromptBuilderTest.xml
          test -f target/surefire-reports/TEST-com.projectflow.ProjectHistoryDogfoodAcceptanceTest.xml
          test -f target/surefire-reports/TEST-com.projectflow.ProjectHistoryProductAcceptanceTest.xml
          for report in \
            CrossConsumerHistoryConsistencyTest \
            RealDogfoodRoleGraphConsistencyTest \
            ModelPortabilityContractTest \
            ModelOutputMinimalSchemaTest \
            UnsupportedClaimFailureTaxonomyTest \
            ProviderNeutralPromptSnapshotTest \
            ProviderNeutralSemanticValidationTest \
            StoryHumanLanguageContractTest \
            CommitHumanSummaryContractTest \
            ChapterHumanLanguageContractTest \
            NonCodeLanguageRegressionTest \
            GenericCommitGroupingTest \
            PrimarySupportingBidirectionalInvariantTest \
            CorrectedProjectionConsistencyTest \
            CorrectedReadRevisionParityTest \
            HumanReviewSampleManifestTest \
            ProjectHistoryHumanNarrativeContractTest \
            ProjectHistoryNarrativeEntailmentTest \
            ProjectHistoryNarrativeParaphraseValidationTest \
            ProjectHistoryHumanSubjectLabelTest \
            ProjectHistoryChapterSemanticSynthesisTest \
            ProjectHistoryChapterNoRawSubjectLeakTest \
            ProjectHistoryBeforeChangeAfterNonRepetitionTest \
            ProjectHistoryUnknownHumanWordingTest \
            ProjectHistoryPlannedVsImplementedTest \
            ProjectHistoryDeclaredVsVerifiedTest \
            ProjectHistoryDogfoodNarrativeEntailmentTest \
            ProjectHistoryNonCodeHumanLanguageTest \
            ProjectHistoryCrossProviderNarrativeParityTest \
            ProjectHistoryHumanReviewRound2ManifestTest; do
            test -f "target/surefire-reports/TEST-com.projectflow.service.${report}.xml"
          done
      - name: 保存 JUnit 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: backend/target/surefire-reports

  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: PostgreSQL Testcontainers 真实集成测试
        working-directory: backend
        run: mvn -B -Ppostgres-it verify
      - name: 保存 PostgreSQL 测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-junit
          path: backend/target/failsafe-reports

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: TypeScript 与生产构建
        working-directory: frontend
        run: npm run lint && npm run build
      - name: 前端契约测试
        working-directory: frontend
        run: npm run test:contracts

  hermes-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ProjectFlow 只读 stdio MCP 契约与故障恢复
        run: python integrations/hermes/test_projectflow_mcp.py

  obsidian-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obsidian 投影完整性、增量、冲突与恢复
        run: python integrations/obsidian/test_projectflow_obsidian.py

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright 核心流程
        working-directory: frontend
        run: npm run test:e2e
      - name: 保存浏览器失败证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  sensitive-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 阻止明显密钥进入仓库
        shell: bash
        run: |
          if git grep -nEI '(sk-[A-Za-z0-9_-]{20,}|ark-[A-Za-z0-9-]{20,}|Bearer [A-Za-z0-9._-]{24,})' -- ':!*.md' ':!*.txt'; then
            echo "检测到疑似密钥或 Authorization 值"
            exit 1
          fi
      - name: 校验 V3.8.0 安全验收产物
        run: python scripts/verify_v380_acceptance_evidence.py

  optional-real-provider-qualification:
    name: optional-real-provider-qualification (${{ matrix.id }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_model
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: glm
            display_name: GLM Responses
            secret_name: PROJECTFLOW_REAL_MODEL_API_KEY
            provider: GLM
            base_url: https://ark.cn-beijing.volces.com/api/coding/v3
            model: glm-5.2
            type: OPENAI
            protocol: OPENAI_RESPONSES
            supports_json_mode: "true"
            supports_reasoning: "true"
            supports_reasoning_control: "true"
            reasoning_effort: high
          - id: deepseek
            display_name: DeepSeek Chat
            secret_name: PROJECTFLOW_DEEPSEEK_API_KEY
            provider: DeepSeek OpenCode Go
            base_url: https://opencode.ai/zen/go/v1
            model: deepseek-v4-flash
            type: DEEPSEEK
            protocol: OPENAI_CHAT_COMPLETIONS
            supports_json_mode: "true"
            supports_reasoning: "true"
            supports_reasoning_control: "true"
            reasoning_effort: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 确认 ${{ matrix.display_name }} 安全凭据已配置
        if: inputs.real_model_provider == 'both' || inputs.real_model_provider == matrix.id
        shell: bash
        env:
          PROVIDER_KEY: ${{ secrets[matrix.secret_name] }}
        run: |
          if [ -z "$PROVIDER_KEY" ]; then
            echo "BLOCKED: ${{ matrix.display_name }} 真实验收 Secret 缺失"
            exit 1
          fi
      - name: 真实 ${{ matrix.display_name }} 连接、Ground Truth 与资格验收
        if: inputs.real_model_provider == 'both' || inputs.real_model_provider == matrix.id
        working-directory: backend
        env:
          PROJECTFLOW_RUN_REAL_MODEL: "true"
          PROJECTFLOW_REAL_MODEL_API_KEY: ${{ secrets[matrix.secret_name] }}
          PROJECTFLOW_REAL_MODEL_PROVIDER: ${{ matrix.provider }}
          PROJECTFLOW_REAL_MODEL_BASE_URL: ${{ matrix.base_url }}
          PROJECTFLOW_REAL_MODEL_NAME: ${{ matrix.model }}
          PROJECTFLOW_REAL_MODEL_TYPE: ${{ matrix.type }}
          PROJECTFLOW_REAL_MODEL_PROTOCOL: ${{ matrix.protocol }}
          PROJECTFLOW_REAL_MODEL_TIMEOUT_SECONDS: "600"
          # QUALITY_FIRST: reasoning and visible JSON share this loose Provider
          # ceiling from the first request. The ceiling is not a Token target;
          # elapsed time and usage remain diagnostics and never lower effort.
          PROJECTFLOW_REAL_MODEL_MAX_TOKENS: "65536"
          PROJECTFLOW_REAL_MODEL_SUPPORTS_JSON_MODE: ${{ matrix.supports_json_mode }}
          PROJECTFLOW_REAL_MODEL_SUPPORTS_REASONING: ${{ matrix.supports_reasoning }}
          PROJECTFLOW_REAL_MODEL_SUPPORTS_REASONING_CONTROL: ${{ matrix.supports_reasoning_control }}
          PROJECTFLOW_MODEL_REASONING_EFFORT: ${{ matrix.reasoning_effort }}
          EVAL_PREFIX: ${{ matrix.id }}
        run: |
          failures=0
          run_gate() {
            label="$1"
            shift
            echo "::group::$label"
            if "$@"; then
              echo "$label: PASS"
            else
              echo "$label: FAIL"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }
          run_gate provider-probe mvn -B -Dtest=ProjectFlowRealProviderProbeIT test
          run_gate history-v380 mvn -B -Dtest=ProjectHistoryRealModelIT -Dprojectflow.eval.output-name="$EVAL_PREFIX-v380" test
          if [ "${{ inputs.real_model_scope }}" = "full" ]; then
            run_gate understanding-v375 mvn -B -Dtest=ProjectFlowRealModelEvalIT -Dprojectflow.eval.output-name="$EVAL_PREFIX-v375" test
            run_gate understanding-e2e mvn -B -Dtest=ProjectUnderstandingRealModelIT -Dprojectflow.eval.output-name="$EVAL_PREFIX-understanding" test
          else
            echo "affected scope: V3.7.5 and Understanding reuse the recorded full baseline"
          fi
          run_gate history-v385-qualification mvn -B -Dtest=ProjectHistoryV385RealOutputEvaluatorTest -Dprojectflow.eval.output-name="$EVAL_PREFIX-v385" test
          if [ "$failures" -ne 0 ]; then
            echo "$EVAL_PREFIX qualification gates failed: $failures"
            exit 1
          fi
      - name: 保存内部真实模型资格评测工件
        if: ${{ always() && (inputs.real_model_provider == 'both' || inputs.real_model_provider == matrix.id) }}
        uses: actions/upload-artifact@v4
        with:
          name: projectflow-real-model-qualification-${{ matrix.id }}
          path: backend/target/projectflow-eval
          if-no-files-found: ignore

  optional-real-provider-scenarios:
    name: optional-real-provider-scenarios (${{ matrix.id }})
    needs: optional-real-provider-qualification
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_real_model }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: glm
            display_name: GLM Responses
            secret_name: PROJECTFLOW_REAL_MODEL_API_KEY
            provider: GLM
            base_url: https://ark.cn-beijing.volces.com/api/coding/v3
            model: glm-5.2
            type: OPENAI
            protocol: OPENAI_RESPONSES
            supports_json_mode: "true"
            supports_reasoning: "true"
            supports_reasoning_control: "true"
            reasoning_effort: high
            dogfood_test: GLMDogfoodRegressionTest
          - id: deepseek
            display_name: DeepSeek Chat
            secret_name: PROJECTFLOW_DEEPSEEK_API_KEY
            provider: DeepSeek OpenCode Go
            base_url: https://opencode.ai/zen/go/v1
            model: deepseek-v4-flash
            type: DEEPSEEK
            protocol: OPENAI_CHAT_COMPLETIONS
            supports_json_mode: "true"
            supports_reasoning: "true"
            supports_reasoning_control: "true"
            reasoning_effort: max
            dogfood_test: DeepSeekDogfoodRegressionTest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 确认 ${{ matrix.display_name }} 安全凭据已配置
        if: inputs.real_model_provider == 'both' || inputs.real_model_provider == matrix.id
        shell: bash
        env:
          PROVIDER_KEY: ${{ secrets[matrix.secret_name] }}
        run: |
          if [ -z "$PROVIDER_KEY" ]; then
            echo "BLOCKED: ${{ matrix.display_name }} 真实验收 Secret 缺失"
            exit 1
          fi
      - name: 真实 ${{ matrix.display_name }} 场景、Dogfood 与非代码验收
        if: inputs.real_model_provider == 'both' || inputs.real_model_provider == matrix.id
        working-directory: backend
        env:
          PROJECTFLOW_RUN_REAL_MODEL: "true"
          PROJECTFLOW_REAL_MODEL_API_KEY: ${{ secrets[matrix.secret_name] }}
          PROJECTFLOW_REAL_MODEL_PROVIDER: ${{ matrix.provider }}
          PROJECTFLOW_REAL_MODEL_BASE_URL: ${{ matrix.base_url }}
          PROJECTFLOW_REAL_MODEL_NAME: ${{ matrix.model }}
          PROJECTFLOW_REAL_MODEL_TYPE: ${{ matrix.type }}
          PROJECTFLOW_REAL_MODEL_PROTOCOL: ${{ matrix.protocol }}
          PROJECTFLOW_REAL_MODEL_TIMEOUT_SECONDS: "600"
          # Keep the exact same QUALITY_FIRST model contract as qualification.
          PROJECTFLOW_REAL_MODEL_MAX_TOKENS: "65536"
          PROJECTFLOW_REAL_MODEL_SUPPORTS_JSON_MODE: ${{ matrix.supports_json_mode }}
          PROJECTFLOW_REAL_MODEL_SUPPORTS_REASONING: ${{ matrix.supports_reasoning }}
          PROJECTFLOW_REAL_MODEL_SUPPORTS_REASONING_CONTROL: ${{ matrix.supports_reasoning_control }}
          PROJECTFLOW_MODEL_REASONING_EFFORT: ${{ matrix.reasoning_effort }}
          EVAL_PREFIX: ${{ matrix.id }}
          DOGFOOD_TEST: ${{ matrix.dogfood_test }}
        run: |
          failures=0
          run_gate() {
            label="$1"
            shift
            echo "::group::$label"
            if "$@"; then
              echo "$label: PASS"
            else
              echo "$label: FAIL"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }
          run_gate history-v385-scenarios mvn -B -Dtest=ProjectHistoryV385RealScenarioEvaluatorTest -Dprojectflow.eval.output-name="$EVAL_PREFIX-v385-scenarios" test
          run_gate history-v385-dogfood mvn -B -Dtest="$DOGFOOD_TEST" -Dprojectflow.eval.output-name="$EVAL_PREFIX-v385-scenarios" test
          if [ "$failures" -ne 0 ]; then
            echo "$EVAL_PREFIX scenario gates failed: $failures"
            exit 1
          fi
      - name: 保存内部真实模型场景评测工件
        if: ${{ always() && (inputs.real_model_provider == 'both' || inputs.real_model_provider == matrix.id) }}
        uses: actions/upload-artifact@v4
        with:
          name: projectflow-real-model-scenarios-${{ matrix.id }}
          path: backend/target/projectflow-eval
          if-no-files-found: ignore
