name: ProjectFlow V3.4.5 Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_model:
        description: "使用 Secret 执行一次受预算限制的 DeepSeek 真实验收"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backend-unit-and-h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 后端单元测试与 H2 兼容回归
        working-directory: backend
        run: mvn -B test
      - name: 保存 JUnit 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: backend/target/surefire-reports

  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: PostgreSQL Testcontainers 真实集成测试
        working-directory: backend
        run: mvn -B -Ppostgres-it verify
      - name: 保存 PostgreSQL 测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-junit
          path: backend/target/failsafe-reports

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: TypeScript 与生产构建
        working-directory: frontend
        run: npm run lint && npm run build
      - name: 前端契约测试
        working-directory: frontend
        run: npm run test:contracts

  hermes-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ProjectFlow 只读 stdio MCP 契约与故障恢复
        run: python integrations/hermes/test_projectflow_mcp.py

  obsidian-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obsidian 投影完整性、增量、冲突与恢复
        run: python integrations/obsidian/test_projectflow_obsidian.py

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright 核心流程
        working-directory: frontend
        run: npm run test:e2e
      - name: 保存浏览器失败证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  sensitive-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 阻止明显密钥进入仓库
        shell: bash
        run: |
          if git grep -nEI '(sk-[A-Za-z0-9_-]{20,}|Bearer [A-Za-z0-9._-]{24,})' -- ':!*.md' ':!*.txt'; then
            echo "检测到疑似密钥或 Authorization 值"
            exit 1
          fi

  optional-real-deepseek:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 真实 DeepSeek 全入口小输入验收
        working-directory: backend
        env:
          PROJECTFLOW_RUN_REAL_MODEL: "true"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "SKIPPED: 未提供安全测试 Key"
            exit 0
          fi
          mvn -B -Ppostgres-it -Dit.test=RealDeepSeekIT verify
