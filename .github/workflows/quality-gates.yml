name: ProjectFlow V3.8.5 Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_model:
        description: "使用 Secrets 执行 GLM 与 DeepSeek V3.8.5 真实验收"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backend-unit-and-h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 后端、H2 与项目历程冻结回归
        working-directory: backend
        run: mvn -B test
      - name: 确认项目历程冻结、Prompt 与 Dogfood 门禁已执行
        working-directory: backend
        shell: bash
        run: |
          test -f target/surefire-reports/TEST-com.projectflow.ProjectHistoryFrozenDatasetTest.xml
          test -f target/surefire-reports/TEST-com.projectflow.service.ProjectHistoryPromptBuilderTest.xml
          test -f target/surefire-reports/TEST-com.projectflow.ProjectHistoryDogfoodAcceptanceTest.xml
          test -f target/surefire-reports/TEST-com.projectflow.ProjectHistoryProductAcceptanceTest.xml
      - name: 保存 JUnit 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: backend/target/surefire-reports

  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: PostgreSQL Testcontainers 真实集成测试
        working-directory: backend
        run: mvn -B -Ppostgres-it verify
      - name: 保存 PostgreSQL 测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-junit
          path: backend/target/failsafe-reports

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: TypeScript 与生产构建
        working-directory: frontend
        run: npm run lint && npm run build
      - name: 前端契约测试
        working-directory: frontend
        run: npm run test:contracts

  hermes-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ProjectFlow 只读 stdio MCP 契约与故障恢复
        run: python integrations/hermes/test_projectflow_mcp.py

  obsidian-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obsidian 投影完整性、增量、冲突与恢复
        run: python integrations/obsidian/test_projectflow_obsidian.py

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright 核心流程
        working-directory: frontend
        run: npm run test:e2e
      - name: 保存浏览器失败证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  sensitive-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 阻止明显密钥进入仓库
        shell: bash
        run: |
          if git grep -nEI '(sk-[A-Za-z0-9_-]{20,}|ark-[A-Za-z0-9-]{20,}|Bearer [A-Za-z0-9._-]{24,})' -- ':!*.md' ':!*.txt'; then
            echo "检测到疑似密钥或 Authorization 值"
            exit 1
          fi
      - name: 校验 V3.8.0 安全验收产物
        run: python scripts/verify_v380_acceptance_evidence.py

  optional-real-provider:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_model
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 确认 GLM 与 DeepSeek 安全凭据均已配置
        shell: bash
        env:
          GLM_KEY: ${{ secrets.PROJECTFLOW_REAL_MODEL_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.PROJECTFLOW_DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$GLM_KEY" ] || [ -z "$DEEPSEEK_KEY" ]; then
            echo "BLOCKED: GLM 或 DeepSeek 真实验收 Secret 缺失"
            exit 1
          fi
      - name: 真实 GLM Responses、Ground Truth、项目理解与项目历程验收
        working-directory: backend
        env:
          PROJECTFLOW_RUN_REAL_MODEL: "true"
          PROJECTFLOW_REAL_MODEL_API_KEY: ${{ secrets.PROJECTFLOW_REAL_MODEL_API_KEY }}
          PROJECTFLOW_REAL_MODEL_PROVIDER: "GLM"
          PROJECTFLOW_REAL_MODEL_BASE_URL: "https://ark.cn-beijing.volces.com/api/coding/v3"
          PROJECTFLOW_REAL_MODEL_NAME: "glm-5.2"
          PROJECTFLOW_REAL_MODEL_TYPE: "OPENAI"
          PROJECTFLOW_REAL_MODEL_PROTOCOL: "OPENAI_RESPONSES"
          PROJECTFLOW_REAL_MODEL_TIMEOUT_SECONDS: "600"
          # QUALITY_FIRST: reasoning and visible JSON share this loose Provider
          # ceiling from the first request. The ceiling is not a Token target;
          # elapsed time and usage remain diagnostics and never lower effort.
          PROJECTFLOW_REAL_MODEL_MAX_TOKENS: "65536"
          PROJECTFLOW_REAL_MODEL_SUPPORTS_JSON_MODE: "true"
          PROJECTFLOW_REAL_MODEL_SUPPORTS_REASONING: "true"
          PROJECTFLOW_REAL_MODEL_SUPPORTS_REASONING_CONTROL: "true"
        run: |
          mvn -B -Dtest=ProjectFlowRealProviderProbeIT test
          mvn -B -Dtest=ProjectHistoryRealModelIT -Dprojectflow.eval.output-name=glm-v380 test
          mvn -B -Dtest=ProjectFlowRealModelEvalIT -Dprojectflow.eval.output-name=glm-v375 test
          mvn -B -Dtest=ProjectUnderstandingRealModelIT -Dprojectflow.eval.output-name=glm-understanding test
          mvn -B -Dtest=ProjectHistoryV385RealOutputEvaluatorTest -Dprojectflow.eval.output-name=glm-v385 test
          mvn -B -Dtest=ProjectHistoryV385RealScenarioEvaluatorTest -Dprojectflow.eval.output-name=glm-v385-scenarios test
          mvn -B -Dtest=GLMDogfoodRegressionTest -Dprojectflow.eval.output-name=glm-v385-scenarios test
      - name: 真实 DeepSeek Chat、Ground Truth 与项目历程验收
        working-directory: backend
        env:
          PROJECTFLOW_RUN_REAL_MODEL: "true"
          PROJECTFLOW_REAL_MODEL_API_KEY: ${{ secrets.PROJECTFLOW_DEEPSEEK_API_KEY }}
          PROJECTFLOW_REAL_MODEL_PROVIDER: "DeepSeek OpenCode Go"
          PROJECTFLOW_REAL_MODEL_BASE_URL: "https://opencode.ai/zen/go/v1"
          PROJECTFLOW_REAL_MODEL_NAME: "deepseek-v4-pro"
          PROJECTFLOW_REAL_MODEL_TYPE: "DEEPSEEK"
          PROJECTFLOW_REAL_MODEL_PROTOCOL: "OPENAI_CHAT_COMPLETIONS"
          PROJECTFLOW_REAL_MODEL_TIMEOUT_SECONDS: "600"
          PROJECTFLOW_REAL_MODEL_MAX_TOKENS: "65536"
          PROJECTFLOW_REAL_MODEL_SUPPORTS_JSON_MODE: "false"
          PROJECTFLOW_REAL_MODEL_SUPPORTS_REASONING: "true"
          PROJECTFLOW_REAL_MODEL_SUPPORTS_REASONING_CONTROL: "false"
        run: |
          mvn -B -Dtest=ProjectFlowRealProviderProbeIT test
          mvn -B -Dtest=ProjectHistoryRealModelIT -Dprojectflow.eval.output-name=deepseek-v380 test
          mvn -B -Dtest=ProjectFlowRealModelEvalIT -Dprojectflow.eval.output-name=deepseek-v375 test
          mvn -B -Dtest=ProjectUnderstandingRealModelIT -Dprojectflow.eval.output-name=deepseek-understanding test
          mvn -B -Dtest=ProjectHistoryV385RealOutputEvaluatorTest -Dprojectflow.eval.output-name=deepseek-v385 test
          mvn -B -Dtest=ProjectHistoryV385RealScenarioEvaluatorTest -Dprojectflow.eval.output-name=deepseek-v385-scenarios test
          mvn -B -Dtest=DeepSeekDogfoodRegressionTest -Dprojectflow.eval.output-name=deepseek-v385-scenarios test
      - name: 保存内部真实模型评测工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projectflow-real-model-eval
          path: backend/target/projectflow-eval
          if-no-files-found: ignore
