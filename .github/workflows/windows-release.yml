name: Windows portable release readiness

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/release/**'
      - '.github/workflows/windows-release.yml'
      - 'docs/projectflow-v3.10-windows-portable-runtime.md'
      - 'docs/projectflow-v3.10-runtime-data-directory-contract.md'
      - 'docs/projectflow-v3.10-upgrade-and-recovery-contract.md'
  push:
    branches:
      - master
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1, pinned to the reviewed commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-java v6.0.0, pinned to the reviewed commit.
      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      # actions/setup-node v7.0.0, pinned to the reviewed commit.
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run release script contract tests
        shell: pwsh
        run: ./scripts/release/test-release-scripts.ps1

      - name: Build Windows portable package
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'projectflow-portable'
          ./scripts/release/build-windows-portable.ps1 -SourceRoot $env:GITHUB_WORKSPACE -OutputRoot $output -Clean

      - name: Run required dependency gates without auto-fix
        shell: pwsh
        run: |
          $audit = Join-Path $env:RUNNER_TEMP 'npm-audit-omit-dev.json'
          npm --prefix frontend audit --omit=dev --json *> $audit
          $npmAuditExit = $LASTEXITCODE
          mvn -B -f backend/pom.xml dependency:list -DincludeScope=runtime -DexcludeTransitive -Dsort=true *> (Join-Path $env:RUNNER_TEMP 'maven-runtime-inventory.txt')
          if ($npmAuditExit -ne 0) { throw 'NET-04 failed: npm production dependency audit reported unresolved advisories.' }

      - name: Run Java DPAPI and legacy H2 gates
        shell: pwsh
        run: |
          $dpapiTest = Get-ChildItem backend/src/test -Recurse -Filter 'WindowsDpapiProviderCredentialStoreTest.java' -File
          if (-not $dpapiTest) { throw 'NET-03 blocked: the Java Windows DPAPI adapter test is missing.' }
          mvn -B -f backend/pom.xml "-Dtest=WindowsDpapiProviderCredentialStoreTest,ProviderCredentialStoreTest,AiProviderCredentialSecurityTest,ProjectFlowFlywayMigrationStrategyTest,ProjectFlowV39DataContinuityMigrationTest,EmbeddedH2BackupServiceTest,ProjectFlowH2UpgradeIntegrationTest" test

      - name: Clean unpack and runtime smoke
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'projectflow-portable.zip'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'projectflow-clean-unpack'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'projectflow-runtime-data'
          $archiveSource = Join-Path $env:RUNNER_TEMP 'projectflow-portable'
          if (Test-Path $packageRoot) { Remove-Item $packageRoot -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $packageRoot
          $manifest = Join-Path $packageRoot 'scripts/release/manifest-projectflow.ps1'
          & $manifest -Root $packageRoot -Verify
          function Get-TreeFingerprint([string]$Root) {
            $lines = @(Get-ChildItem -LiteralPath $Root -Recurse -File -Force | Sort-Object FullName | ForEach-Object {
              $relative = $_.FullName.Substring($Root.Length).TrimStart('\').Replace('\','/')
              "${relative}:$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
            })
            $bytes = [Text.Encoding]::UTF8.GetBytes(($lines -join "`n"))
            return ([BitConverter]::ToString(([System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)))).Replace('-','')
          }
          $before = Get-TreeFingerprint $packageRoot

          $systemPath = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $savedPath = $env:Path
          $savedJavaHome = $env:JAVA_HOME
          try {
            $env:Path = $systemPath
            Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
            & (Join-Path $packageRoot 'scripts/release/start-projectflow.ps1') -DataRoot $dataRoot -NoBrowser
            $state = Get-Content (Join-Path $dataRoot 'run/instance.json') -Raw | ConvertFrom-Json
            foreach ($processRecord in @($state.backend, $state.frontend)) {
              $process = Get-CimInstance Win32_Process -Filter "ProcessId=$($processRecord.pid)" -ErrorAction SilentlyContinue
              if (-not $process) { throw 'RUN-03 failed: a recorded runtime process disappeared before identity verification.' }
              $commandLine = [string]$process.CommandLine
              $marker = [IO.Path]::GetFileName(([string]$processRecord.artifact).Replace('/','\'))
              if ([string]::IsNullOrWhiteSpace($marker) -or $commandLine.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -lt 0) { throw 'RUN-03 failed: a runtime PID did not carry its recorded bundled artifact.' }
              if ($commandLine -match '(?i)(^|[\\/ ])(mvn|npm|git)(\.cmd|\.exe)?([\\/ ]|$)') { throw 'RUN-03 failed: a runtime process command line contains a developer build tool.' }
            }
          } finally {
            & (Join-Path $packageRoot 'scripts/release/stop-projectflow.ps1') -DataRoot $dataRoot
          }
          try {
            & (Join-Path $packageRoot 'scripts/release/start-projectflow.ps1') -DataRoot $dataRoot -NoBrowser
            $state = Get-Content (Join-Path $dataRoot 'run/instance.json') -Raw | ConvertFrom-Json
            foreach ($processRecord in @($state.backend, $state.frontend)) {
              $process = Get-CimInstance Win32_Process -Filter "ProcessId=$($processRecord.pid)" -ErrorAction SilentlyContinue
              if (-not $process) { throw 'RUN-03 failed: the second runtime start lost a recorded process.' }
            }
          } finally {
            & (Join-Path $packageRoot 'scripts/release/stop-projectflow.ps1') -DataRoot $dataRoot
          }
          try {
            & (Join-Path $packageRoot 'scripts/release/dpapi-smoke.ps1') -DataRoot $dataRoot
          } finally {
            $env:Path = $savedPath
            if ($null -eq $savedJavaHome) { Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue } else { $env:JAVA_HOME = $savedJavaHome }
          }
          $after = Get-TreeFingerprint $packageRoot
          if ($before -ne $after) { throw 'RUN-03 failed: install tree checksum changed during runtime.' }
          & $manifest -Root $packageRoot -Verify
          if ((Get-NetTCPConnection -State Listen -LocalPort 8080 -ErrorAction SilentlyContinue) -or (Get-NetTCPConnection -State Listen -LocalPort 3000 -ErrorAction SilentlyContinue)) { throw 'RUN-05 failed: a runtime port remains occupied after stop.' }

      - name: H2 backup and restore smoke
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'projectflow-clean-unpack'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'projectflow-runtime-data'
          $backup = Join-Path $packageRoot 'scripts/release/backup-projectflow.ps1'
          $restore = Join-Path $packageRoot 'scripts/release/restore-projectflow.ps1'
          & $backup -DataRoot $dataRoot -ReleaseRoot $packageRoot -Reason 'windows-ci' -RequireDatabase
          $backupManifest = Get-ChildItem (Join-Path $dataRoot 'backups') -Filter '*.manifest.json' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $backupManifest) { throw 'REC-01 failed: no complete backup manifest.' }
          $backupMetadata = Get-Content $backupManifest.FullName -Raw | ConvertFrom-Json
          if ($backupMetadata.complete -ne $true -or [string]$backupMetadata.schemaClassification -notin @('KNOWN_V39','KNOWN_CURRENT')) {
            throw 'REC-01 blocked: the release backup has no verified schema identity; runtime SQL-only backup cannot satisfy the recovery contract.'
          }
          & $restore -BackupManifest $backupManifest.FullName -DataRoot $dataRoot -ReleaseRoot $packageRoot

      - name: Synthetic V3.9 H2 legacy baseline smoke
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'projectflow-clean-unpack'
          $legacyRoot = Join-Path $env:RUNNER_TEMP 'projectflow-v39-legacy-data'
          $dbDir = Join-Path $legacyRoot 'data/database'
          New-Item -ItemType Directory -Force -Path $dbDir | Out-Null
          $h2 = Join-Path $packageRoot 'runtime/h2/h2-restore.jar'
          $java = Join-Path $packageRoot 'runtime/java/bin/java.exe'
          $legacySql = Join-Path $env:GITHUB_WORKSPACE 'backend/src/main/resources/db/migration/V1__v39_schema_baseline.sql'
          $url = 'jdbc:h2:file:' + (($dbDir.Replace('\','/')) + '/projectflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE')
          $runScript = "RUNSCRIPT FROM '$($legacySql.Replace('\','/').Replace("'", "''"))'"
          & $java -cp $h2 org.h2.tools.Shell -url $url -user sa -password '' -sql $runScript *> $null
          if ($LASTEXITCODE -ne 0) { throw 'MIG-03 failed: synthetic V3.9 H2 fixture could not be created.' }
          $legacyUser = '00000000-0000-0000-0000-000000000001'
          $legacyProject = '00000000-0000-0000-0000-000000000002'
          $insertUser = "INSERT INTO users(created_at,updated_at,id,username,email,password_hash) VALUES(CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,'$legacyUser','v39-fixture-user','v39-fixture@example.invalid','fixture-hash')"
          $insertProject = "INSERT INTO projects(created_at,updated_at,id,user_id,status,name) VALUES(CURRENT_TIMESTAMP,CURRENT_TIMESTAMP,'$legacyProject','$legacyUser','PLANNING','V3.9 protected fixture')"
          & $java -cp $h2 org.h2.tools.Shell -url $url -user sa -password '' -sql $insertUser *> $null
          if ($LASTEXITCODE -ne 0) { throw 'MIG-03 failed: synthetic V3.9 protected user could not be inserted.' }
          & $java -cp $h2 org.h2.tools.Shell -url $url -user sa -password '' -sql $insertProject *> $null
          if ($LASTEXITCODE -ne 0) { throw 'MIG-03 failed: synthetic V3.9 protected project could not be inserted.' }
          & (Join-Path $packageRoot 'scripts/release/start-projectflow.ps1') -DataRoot $legacyRoot -NoBrowser
          & (Join-Path $packageRoot 'scripts/release/stop-projectflow.ps1') -DataRoot $legacyRoot
          $checkUrl = $url + ';IFEXISTS=TRUE'
          $history = & $java -cp $h2 org.h2.tools.Shell -url $checkUrl -user sa -password '' -sql 'SELECT VERSION FROM FLYWAY_SCHEMA_HISTORY ORDER BY INSTALLED_RANK' 2>$null
          $protected = & $java -cp $h2 org.h2.tools.Shell -url $checkUrl -user sa -password '' -sql "SELECT COUNT(*) FROM projects WHERE id='$legacyProject'" 2>$null
          if ($LASTEXITCODE -ne 0 -or -not ($history -match '(?m)^2\s*$') -or -not ($protected -match '(?m)^1\s*$')) { throw 'MIG-03 failed: Flyway did not record the controlled V2 upgrade or the protected project was not preserved.' }

      - name: Port conflict smoke
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'projectflow-clean-unpack'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'projectflow-port-conflict-data'
          $holder = Join-Path $env:RUNNER_TEMP 'projectflow-port-holder.ps1'
          Set-Content -LiteralPath $holder -Encoding UTF8 -Value @'
          param([int]$Port)
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, $Port)
          $listener.Start()
          try { Start-Sleep -Seconds 180 } finally { $listener.Stop() }
          '@
          $process = Start-Process -FilePath powershell.exe -WindowStyle Hidden -PassThru -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$holder,'8080')
          try {
            Start-Sleep -Seconds 2
            $failed = $false
            try { & (Join-Path $packageRoot 'scripts/release/start-projectflow.ps1') -DataRoot $dataRoot -NoBrowser } catch { $failed = $true }
            if (-not $failed) { throw 'RUN-06 failed: foreign port was not rejected.' }
            if (-not (Get-Process -Id $process.Id -ErrorAction SilentlyContinue)) { throw 'RUN-06 failed: foreign listener was terminated.' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Scan runtime logs and package for sensitive markers
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'projectflow-clean-unpack'
          $dataRoot = Join-Path $env:RUNNER_TEMP 'projectflow-runtime-data'
          $binaryExtensions = @('.exe','.dll','.jar','.zip','.db','.bin','.node','.wasm','.woff','.woff2','.ttf','.otf','.png','.jpg','.jpeg','.gif','.ico','.webp','.pdf')
          $textFiles = @(Get-ChildItem $packageRoot,$dataRoot -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $binaryExtensions -notcontains $_.Extension.ToLowerInvariant() })
          $matches = @($textFiles | Select-String -Pattern '(?i)(?:\bsk-(?:proj-)?[A-Za-z0-9]{20,}\b|\bark-[A-Za-z0-9]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}\b|\bBearer\s+(?=[A-Za-z0-9._-]{16,}\b)(?=[A-Za-z0-9._-]*\d)[A-Za-z0-9._-]{16,}\b|\bAuthorization\s*:\s*(?:Bearer\s+)?(?=[A-Za-z0-9._-]{16,}\b)(?=[A-Za-z0-9._-]*\d)[A-Za-z0-9._-]{16,}\b)')
          if ($matches.Count -gt 0) { throw 'NET-03 failed: a sensitive marker was found in the release package or runtime data.' }

      # actions/upload-artifact v7.0.1, pinned to the reviewed commit.
      - name: Upload sanitized Windows evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: projectflow-windows-release-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/projectflow-portable.zip
            ${{ runner.temp }}/projectflow-portable.zip.sha256
            ${{ runner.temp }}/npm-audit-omit-dev.json
            ${{ runner.temp }}/maven-runtime-inventory.txt
