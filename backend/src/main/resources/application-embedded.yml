server:
  address: 127.0.0.1

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    # Embedded launcher owns this single-process database; AUTO_SERVER can leave a remote stale lock after Docker/VM use.
    url: jdbc:h2:file:${PROJECTFLOW_DATA_DIR:./.projectflow/local-data}/projectflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: ${PROJECTFLOW_FLYWAY_ENABLED:false}
    baseline-on-migrate: false
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false

projectflow:
  migration:
    backup-directory: ${PROJECTFLOW_MIGRATION_BACKUP_DIR:${PROJECTFLOW_DATA_DIR:./.projectflow/local-data}/backups}
    postgres-backup-confirmed: ${PROJECTFLOW_POSTGRES_BACKUP_CONFIRMED:false}
  storage:
    mode: embedded
    data-dir: ${PROJECTFLOW_DATA_DIR:./.projectflow/local-data}
