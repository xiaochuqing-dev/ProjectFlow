projectflow:
  runtime:
    mode: external
    data-contract-version: projectflow-runtime-data-v1
  auth:
    required: true
  credentials:
    store: ${PROJECTFLOW_CREDENTIAL_STORE:auto}

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: 1
    validate-on-migrate: true
    locations: classpath:db/migration
