server:
  port: ${APP_PORT:8080}
  tomcat:
    max-swallow-size: ${PROJECTFLOW_MAX_UPLOAD_SIZE:512MB}

spring:
  application:
    name: projectflow
  servlet:
    multipart:
      max-file-size: ${PROJECTFLOW_MAX_UPLOAD_SIZE:512MB}
      max-request-size: ${PROJECTFLOW_MAX_UPLOAD_SIZE:512MB}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/projectflow}
    username: ${DATABASE_USERNAME:projectflow}
    password: ${DATABASE_PASSWORD:change-me-local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    # Developer mode keeps the historical update path until a release profile opts in.
    enabled: ${PROJECTFLOW_FLYWAY_ENABLED:false}
    baseline-on-migrate: false
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

projectflow:
  migration:
    backup-directory: ${PROJECTFLOW_MIGRATION_BACKUP_DIR:./.projectflow/local-data/backups}
    postgres-backup-confirmed: ${PROJECTFLOW_POSTGRES_BACKUP_CONFIRMED:false}
  auth:
    required: ${PROJECTFLOW_AUTH_REQUIRED:false}
    password-reset-code: ${PROJECTFLOW_PASSWORD_RESET_CODE:}
    # 重置码有效期，单位：分钟。
    password-reset-code-valid-minutes: ${PROJECTFLOW_PASSWORD_RESET_CODE_VALID_MINUTES:30}
  upload:
    max-zip-file-bytes: ${PROJECTFLOW_MAX_ZIP_FILE_BYTES:536870912}
    max-zip-read-bytes: ${PROJECTFLOW_MAX_ZIP_READ_BYTES:67108864}
  jwt:
    secret: ${JWT_SECRET:replace-with-at-least-32-random-bytes}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
  model:
    # 建连与单次 Provider 请求独立有界；它们不充当总体项目分析时长上限。
    connection-timeout-seconds: ${PROJECTFLOW_MODEL_CONNECTION_TIMEOUT_SECONDS:10}
    request-timeout-seconds: ${PROJECTFLOW_MODEL_TIMEOUT_SECONDS:240}
  timeline:
    # 留空时统一使用运行机器时区；部署环境可显式覆盖。
    zone: ${PROJECTFLOW_TIMELINE_ZONE:}
  jobs:
    core-pool-size: ${PROJECTFLOW_JOB_CORE_THREADS:2}
    max-pool-size: ${PROJECTFLOW_JOB_MAX_THREADS:4}
    queue-capacity: ${PROJECTFLOW_JOB_QUEUE_CAPACITY:16}
    global-active-limit: ${PROJECTFLOW_JOB_GLOBAL_ACTIVE_LIMIT:20}
    # 服务关闭等待时间，单位：秒。
    shutdown-wait-seconds: ${PROJECTFLOW_JOB_SHUTDOWN_WAIT_SECONDS:30}
  understanding:
    # 扫描、索引和模型上下文都必须有界；达到上限时返回覆盖率与未知项，不静默伪装完整。
    max-files: ${PROJECTFLOW_UNDERSTANDING_MAX_FILES:250000}
    max-file-details: ${PROJECTFLOW_UNDERSTANDING_MAX_FILE_DETAILS:5000}
    max-file-read-bytes: ${PROJECTFLOW_UNDERSTANDING_MAX_FILE_READ_BYTES:8388608}
    max-total-read-bytes: ${PROJECTFLOW_UNDERSTANDING_MAX_TOTAL_READ_BYTES:536870912}
    max-source-sample-bytes: ${PROJECTFLOW_UNDERSTANDING_MAX_SOURCE_SAMPLE_BYTES:65536}
    max-source-content-samples: ${PROJECTFLOW_UNDERSTANDING_MAX_SOURCE_CONTENT_SAMPLES:1500}
    small-loc: ${PROJECTFLOW_UNDERSTANDING_SMALL_LOC:20000}
    medium-loc: ${PROJECTFLOW_UNDERSTANDING_MEDIUM_LOC:100000}
    large-loc: ${PROJECTFLOW_UNDERSTANDING_LARGE_LOC:500000}
    max-model-prompt-chars: ${PROJECTFLOW_UNDERSTANDING_MAX_PROMPT_CHARS:48000}
    max-evidence-candidates: ${PROJECTFLOW_UNDERSTANDING_MAX_EVIDENCE_CANDIDATES:500}
    max-scout-evidence: ${PROJECTFLOW_UNDERSTANDING_MAX_SCOUT_EVIDENCE:40}
    max-evidence-sample-chars: ${PROJECTFLOW_UNDERSTANDING_MAX_EVIDENCE_SAMPLE_CHARS:1600}
    max-evidence-sample-bytes: ${PROJECTFLOW_UNDERSTANDING_MAX_EVIDENCE_SAMPLE_BYTES:8192}
    scip:
      # 继续只消费官方 SCIP protobuf；producer 缺失或失败时回退，不在用户项目中静默安装 runtime。
      max-index-bytes: ${PROJECTFLOW_SCIP_MAX_INDEX_BYTES:268435456}
      max-documents: ${PROJECTFLOW_SCIP_MAX_DOCUMENTS:20000}
      max-symbols: ${PROJECTFLOW_SCIP_MAX_SYMBOLS:50000}
      max-definitions: ${PROJECTFLOW_SCIP_MAX_DEFINITIONS:50000}
      max-references: ${PROJECTFLOW_SCIP_MAX_REFERENCES:100000}
      max-relations: ${PROJECTFLOW_SCIP_MAX_RELATIONS:100000}
      max-functional-areas: ${PROJECTFLOW_SCIP_MAX_FUNCTIONAL_AREAS:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info
