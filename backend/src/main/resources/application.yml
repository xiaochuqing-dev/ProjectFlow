server:
  port: ${APP_PORT:8080}
  tomcat:
    max-swallow-size: ${PROJECTFLOW_MAX_UPLOAD_SIZE:512MB}

spring:
  application:
    name: projectflow
  servlet:
    multipart:
      max-file-size: ${PROJECTFLOW_MAX_UPLOAD_SIZE:512MB}
      max-request-size: ${PROJECTFLOW_MAX_UPLOAD_SIZE:512MB}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/projectflow}
    username: ${DATABASE_USERNAME:projectflow}
    password: ${DATABASE_PASSWORD:change-me-local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

projectflow:
  auth:
    required: ${PROJECTFLOW_AUTH_REQUIRED:false}
    password-reset-code: ${PROJECTFLOW_PASSWORD_RESET_CODE:}
    # 重置码有效期，单位：分钟。
    password-reset-code-valid-minutes: ${PROJECTFLOW_PASSWORD_RESET_CODE_VALID_MINUTES:30}
  upload:
    max-zip-file-bytes: ${PROJECTFLOW_MAX_ZIP_FILE_BYTES:536870912}
    max-zip-read-bytes: ${PROJECTFLOW_MAX_ZIP_READ_BYTES:67108864}
  jwt:
    secret: ${JWT_SECRET:replace-with-at-least-32-random-bytes}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
  model:
    # V3.3.8: Provider capability 可提高 reasoning 模型建议超时；这里是普通请求的可配置基线。
    request-timeout-seconds: ${PROJECTFLOW_MODEL_TIMEOUT_SECONDS:240}
  jobs:
    core-pool-size: ${PROJECTFLOW_JOB_CORE_THREADS:2}
    max-pool-size: ${PROJECTFLOW_JOB_MAX_THREADS:4}
    queue-capacity: ${PROJECTFLOW_JOB_QUEUE_CAPACITY:16}
    global-active-limit: ${PROJECTFLOW_JOB_GLOBAL_ACTIVE_LIMIT:20}
    # 服务关闭等待时间，单位：秒。
    shutdown-wait-seconds: ${PROJECTFLOW_JOB_SHUTDOWN_WAIT_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
