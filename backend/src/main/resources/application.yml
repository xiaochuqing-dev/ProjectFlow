server:
  port: ${APP_PORT:8080}
  tomcat:
    max-swallow-size: ${PROJECTFLOW_MAX_UPLOAD_SIZE:512MB}

spring:
  application:
    name: projectflow
  servlet:
    multipart:
      max-file-size: ${PROJECTFLOW_MAX_UPLOAD_SIZE:512MB}
      max-request-size: ${PROJECTFLOW_MAX_UPLOAD_SIZE:512MB}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/projectflow}
    username: ${DATABASE_USERNAME:projectflow}
    password: ${DATABASE_PASSWORD:change-me-local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

projectflow:
  upload:
    max-zip-file-bytes: ${PROJECTFLOW_MAX_ZIP_FILE_BYTES:536870912}
    max-zip-read-bytes: ${PROJECTFLOW_MAX_ZIP_READ_BYTES:67108864}
  jwt:
    secret: ${JWT_SECRET:replace-with-at-least-32-random-bytes}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
