spring:
  datasource:
    url: jdbc:h2:mem:projectflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

projectflow:
  jwt:
    secret: test-secret-must-be-at-least-32-bytes-long
    access-token-minutes: 60
